name: metrics (achievements card)

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render achievements card
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-achievements.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: nolanpix
          template: classic
          base: ""
          config_timezone: America/Los_Angeles
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_limit: 8
          output_action: none

      - name: Commit card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          f=metrics-achievements.svg
          test -s "$f" || { echo "::error::metrics produced no $f"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$f" --jq .sha 2>/dev/null || true)
          cur=$(gh api "repos/$GITHUB_REPOSITORY/contents/$f" --jq .content 2>/dev/null | tr -d '\n' || true)
          new=$(base64 -w0 "$f")
          if [ "$cur" = "$new" ]; then echo "card unchanged, nothing to commit"; exit 0; fi
          if [ -n "$sha" ]; then extra=(-f "sha=$sha"); else extra=(); fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$f" \
            -f message="chore: update achievements card" \
            -f content="$(base64 -w0 "$f")" "${extra[@]+"${extra[@]}"}"
