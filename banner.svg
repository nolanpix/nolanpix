<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Nolan Pierce — digital IC physical design">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#c0398f"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c0398f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c0398f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8H8" stroke="#1d2733" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="#0d1117"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <ellipse cx="80" cy="20" rx="420" ry="260" fill="url(#glow-a)"/>
  <ellipse cx="1140" cy="270" rx="380" ry="240" fill="url(#glow-b)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="72" y="86" font-size="17" letter-spacing="2.5" fill="#ff8a6a" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">np.</text>
    <text x="72" y="150" font-size="56" font-weight="700" fill="#f0f6fc">Nolan Pierce</text>
    <text x="72" y="188" font-size="18" fill="#8b949e" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">digital IC physical design — floorplan to signoff</text>
  </g>
  <rect x="72" y="212" width="104" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- floorplan: die outline, IO ring, hierarchy blocks, clock tree and routed nets -->
  <g transform="translate(742,40)">
    <rect x="0.5" y="0.5" width="379" height="199" rx="10" fill="#0b1017" stroke="#2b3440"/>

    <!-- IO ring -->
    <g fill="#1b2330" stroke="#30363d" stroke-width="0.8">
      <rect x="20" y="4" width="14" height="5"/><rect x="48" y="4" width="14" height="5"/>
      <rect x="96" y="4" width="14" height="5"/><rect x="144" y="4" width="14" height="5"/>
      <rect x="212" y="4" width="14" height="5"/><rect x="260" y="4" width="14" height="5"/>
      <rect x="308" y="4" width="14" height="5"/><rect x="356" y="4" width="14" height="5"/>
      <rect x="20" y="191" width="14" height="5"/><rect x="68" y="191" width="14" height="5"/>
      <rect x="136" y="191" width="14" height="5"/><rect x="204" y="191" width="14" height="5"/>
      <rect x="272" y="191" width="14" height="5"/><rect x="340" y="191" width="14" height="5"/>
      <rect x="4" y="26" width="5" height="14"/><rect x="4" y="70" width="5" height="14"/>
      <rect x="4" y="114" width="5" height="14"/><rect x="4" y="158" width="5" height="14"/>
      <rect x="371" y="26" width="5" height="14"/><rect x="371" y="70" width="5" height="14"/>
      <rect x="371" y="114" width="5" height="14"/><rect x="371" y="158" width="5" height="14"/>
    </g>

    <!-- blocks -->
    <g fill="#131a22" stroke="#2b3440" stroke-width="1">
      <rect x="18" y="16" width="98" height="64" rx="4"/>
      <rect x="18" y="90" width="98" height="42" rx="4"/>
      <rect x="18" y="142" width="98" height="38" rx="4"/>
      <rect x="128" y="16" width="150" height="118" rx="4"/>
      <rect x="128" y="144" width="150" height="36" rx="4"/>
      <rect x="290" y="16" width="72" height="58" rx="4"/>
      <rect x="290" y="84" width="72" height="46" rx="4"/>
      <rect x="290" y="140" width="72" height="40" rx="4"/>
    </g>
    <rect x="18" y="16" width="98" height="64" rx="4" fill="url(#hatch)"/>
    <rect x="128" y="16" width="150" height="118" rx="4" fill="url(#hatch)" opacity="0.7"/>
    <rect x="128" y="16" width="150" height="118" rx="4" fill="none" stroke="url(#accent)" stroke-opacity="0.55"/>

    <!-- power grid -->
    <g stroke="#ffffff" stroke-opacity="0.05">
      <path d="M18 52H362"/><path d="M18 104H362"/><path d="M18 160H362"/>
      <path d="M96 16V180"/><path d="M203 16V180"/><path d="M326 16V180"/>
    </g>

    <!-- routed nets with 45 degree bends -->
    <g stroke="#ff5a3c" stroke-opacity="0.8" stroke-width="1.4" fill="none" stroke-linejoin="round">
      <path d="M18 111H60L78 129H128"/>
      <path d="M128 96H104L86 78H68"/>
      <path d="M278 60H312L326 74V84"/>
      <path d="M278 162H302L318 178H340"/>
      <path d="M116 161H128"/>
    </g>

    <!-- clock tree from the CLK block -->
    <g stroke="#c0398f" stroke-opacity="0.75" stroke-width="1.2" fill="none" stroke-linejoin="round">
      <path d="M326 140V126"/>
      <path d="M326 126H300L286 118"/>
      <path d="M326 126H340L352 118"/>
      <path d="M326 126V112"/>
    </g>
    <g fill="#c0398f" opacity="0.9">
      <circle cx="286" cy="118" r="2.2"/><circle cx="352" cy="118" r="2.2"/><circle cx="326" cy="112" r="2.2"/>
    </g>

    <!-- vias -->
    <g fill="#0b1017" stroke="#ff5a3c" stroke-opacity="0.9" stroke-width="1.2">
      <circle cx="60" cy="111" r="2"/><circle cx="78" cy="129" r="2"/>
      <circle cx="312" cy="60" r="2"/><circle cx="302" cy="162" r="2"/>
      <circle cx="86" cy="78" r="2"/>
    </g>

    <!-- block labels -->
    <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace"
       font-size="7.5" letter-spacing="0.6" fill="#6e7681">
      <text x="24" y="30">SRAM</text>
      <text x="24" y="104">PLL</text>
      <text x="24" y="156">MAC</text>
      <text x="134" y="30">CORE</text>
      <text x="134" y="158">DSP</text>
      <text x="296" y="30">PHY</text>
      <text x="296" y="98">IO</text>
      <text x="296" y="154">CLK</text>
    </g>
  </g>
</svg>
